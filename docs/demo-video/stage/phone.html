<!doctype html>
<html><head><meta charset="utf-8"><title>Ark SOS</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 70% 30%,#3a1414,#0a0608 65%);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
  .phone{position:absolute;left:50%;top:50%;transform:translateX(-50%);top:40px;width:340px;height:756px;border-radius:52px;padding:14px;background:#111;
    box-shadow:0 0 0 2px #333,0 40px 90px rgba(0,0,0,.6)}
  video{width:100%;height:100%;border-radius:40px;object-fit:cover;background:#000}
  .side{position:absolute;top:50%;transform:translateY(-60%);width:520px}
  .l{left:120px}.r{right:120px;text-align:left}
  .side h2{margin:0 0 12px;font-size:44px;letter-spacing:-.02em}
  .side p{margin:0;font-size:22px;line-height:1.45;color:#e6cfcf}
  .side .k{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
  .side .k span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:16px}
</style></head><body>
<div class="side l"><h2>Ark SOS</h2><p>For the person in the water: no login, no password, no forms first. One big red button, held for 2 seconds.</p>
  <div class="k"><span>English</span><span>Bahasa Melayu</span><span>中文</span><span>தமிழ்</span></div></div>
<div class="side r" id="r"><h2 id="rh">Where</h2><p id="rp">A flooded kampung near Beaufort, Sabah. The phone's GPS goes with the SOS and keeps updating until help arrives.</p></div>
<div class="phone"><video id="v" muted playsinline></video><img id="i" style="display:none;width:100%;height:100%;border-radius:40px;object-fit:cover"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = document.getElementById('v');
  if (q.get('src').endsWith('.png')) { v.style.display = 'none'; const i = document.getElementById('i'); i.style.display = ''; i.src = q.get('src'); window.__ready = true; window.__play = () => {}; }
  else v.src = q.get('src'); v.currentTime = +(q.get('from') || 0);
  v.playbackRate = +(q.get('rate') || 1);
  if (q.get('rh')) { document.getElementById('rh').textContent = q.get('rh'); document.getElementById('rp').textContent = q.get('rp'); }
  if (!window.__play) window.__play = () => { v.play(); };
  v.addEventListener('canplay', () => (window.__ready = true), { once: true });
</script></body></html>
