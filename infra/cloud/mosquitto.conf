# Public demo broker (stand-in for AWS IoT Core). Mounted over infra/local/mosquitto.conf by infra/cloud/compose.yaml.
# shortcut: one shared operator password, swap for AWS IoT Core + Cognito per-user auth when infra/ is built.
per_listener_settings true
persistence false

# Services on the Docker network (sim, fleet, health, sos-api, gateway). Not published to the internet.
listener 1883
allow_anonymous true

# Browsers, through Caddy (wss://<domain>/mqtt): anyone can watch, only the "operator" login can command.
listener 9001
protocol websockets
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
